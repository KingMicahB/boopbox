# -Djdk.net.unixdomain.tmpdir=... : on this PC Windows AF_UNIX sockets fail ("Unable to establish loopback
# connection" / "Invalid argument: connect"). Pointing the JDK at a non-existent dir makes it fall back to TCP.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=C:/nonexistent_dir_for_uds_fallback
kotlin.daemon.jvmargs=-Xmx1g -Djdk.net.unixdomain.tmpdir=C:/nonexistent_dir_for_uds_fallback
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Gradle 8.13 runs on JDK 17-23. JDK 27 (system default) is too new, so point at JDK 22.
org.gradle.java.home=C\:/Program Files/Java/jdk-22
